name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VolTap.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VolTap-debug-apk
          path: VolTap.apk

      # Publishes the newest APK as a download on the Releases page.
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VolTap.apk \
            --title "VolTap (latest build)" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Download VolTap.apk, open it on your phone and allow installing from this source." \
            --prerelease \
            --target "$GITHUB_SHA"
